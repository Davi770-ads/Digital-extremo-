
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ENERGYM - Embates</title>

    <!-- CSS -->
    <link rel="stylesheet" href="embates.css">
</head>

<body>

    <header>

        <div class="logo">
            <img 
                src="logo0.1-removebg-preview.png"
                width="300"
                height="85"
                alt="Logo ENERGYM">
        </div>

        <nav>
            <a href="file:///C:/Users/Ricardo%20Nascimento/Downloads/ola%20mundo%202.0/teste.html">Início</a>
            <a href="file:///C:/Users/Ricardo%20Nascimento/Downloads/ola%20mundo%202.0/Basquete.html">Perfil</a>
            <a href="#">Ranking</a>
            <a href="#">Comunidade</a>
            <a href="#">Atividade</a>
        </nav>

    </header>


    <main>

        <!-- TOPO -->
        <section class="topo">

            <div>

                <span class="tag">
                     EMBATES, ORGANIZE PARTIDAS E DIVIRTA-SE!
                </span>

                <h1>
                    Crie um
                    <span>embate</span>
                </h1>

                <p>
                    Encontre pessoas para praticar esportes
                    perto de você.
                </p>

            </div>

        </section>


        <!-- CONTEÚDO -->
        <section class="conteudo">

            <!-- MAPA -->
            <div class="mapa-area">

                <div id="map">

                    <!-- Mapa temporário -->
                    <iframe
                        src="https://maps.google.com/maps?q=Extremoz%20RN%20CEEP&t=&z=13&ie=UTF8&iwloc=&output=embed"
                        width="100%"
                        height="100%"
                        style="border:0;"
                        loading="lazy"
                        title="Mapa">
                    </iframe>

                </div>


                <button
                    type="button"
                    class="localizacao"
                    onclick="usarMinhaLocalizacao()">

                     Usar minha localização

                </button>

            </div>


            <!-- PAINEL -->
            <div class="painel">

                <h2>Criar embate</h2>

                <p class="descricao">
                    Clique no mapa para escolher o local.
                </p>


                <label for="nome">
                    Nome do embate
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Ex: Futebol sábado">


                <label for="esporte">
                    Esporte
                </label>

                <select id="esporte">

                    <option value="Futebol">
                        ⚽ Futebol
                    </option>

                    <option value="Basquete">
                        🏀 Basquete
                    </option>

                    <option value="Vôlei">
                        🏐 Vôlei
                    </option>

                    <option value="Corrida">
                        🏃 Corrida
                    </option>

                </select>


                <div class="linha">

                    <div>

                        <label for="data">
                            Data
                        </label>

                        <input
                            type="date"
                            id="data">

                    </div>


                    <div>

                        <label for="horario">
                            Horário
                        </label>

                        <input
                            type="time"
                            id="horario">

                    </div>

                </div>


                <label for="vagas">
                    Número de vagas
                </label>

                <input
                    type="number"
                    id="vagas"
                    min="2"
                    value="10">


                <!-- LOCAL SELECIONADO -->
                <div class="local-selecionado">

                    <strong>
                        📍 Local selecionado
                    </strong>

                    <p id="localTexto">
                        Nenhum local selecionado
                    </p>

                </div>


                <!-- BOTÃO -->
                <button
                    type="button"
                    class="criar"
                    onclick="criarEmbate()">

                    🚀 Criar embate

                </button>

            </div>

        </section>


        <!-- EMBATES -->
        <section class="embates">

          

            <div id="listaEmbates"></div>

        </section>

    </main>
            </section>

    </main>


   
   


    <script
        src="https://maps.googleapis.com/maps/api/js?key=SUA_API_KEY&callback=initMap&libraries=marker"
        async
        defer>
    </script>

</body>

</html>


</body>

</html>
