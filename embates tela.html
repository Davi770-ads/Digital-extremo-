<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ENERGYM - Embates</title>

    <link rel="stylesheet" href="embates.css">
    <link rel="stylesheet" href="s">
</head>

<body>

<header>

    <div class="logo">
    
        <img src="logo0.1-removebg-preview.png" width="250px" height="'150px" alt="">
    </div>

    <nav>
        <a href="#">INICIO</a>
        <a href="#">PERFIL</a>
        <a href="#">RANKING</a>
        <a href="#">COMUNIDADE</a>
    </nav>

</header>


<main>

    <section class="topo">

        <div>
            <span class="tag">🏆 EMBATES,ORGANIZE PARTIDAS E DIVIRTA-SE!</span>

            <h1>
                Encontre ou crie um
                <span>embate</span>
            </h1>

            <p>
                Encontre pessoas para praticar esportes
                perto de você.
            </p>
        </div>

    </section>


    <section class="conteudo">

        <div class="mapa-area">

            <div id="map"></div>

            <button
                class="localizacao"
                onclick="usarMinhaLocalizacao()">

                📍 Usar minha localização

            </button>

        </div>


        <div class="painel">

            <h2>🔥 Criar embate</h2>

            <p class="descricao">
                Clique no mapa para escolher o local.
            </p>


            <label>Nome do embate</label>

            <input
                type="text"
                id="nome"
                placeholder="Ex: Futebol sábado">


            <label>Esporte</label>

            <select id="esporte">

                <option value="Futebol">
                    ⚽ Futebol
                </option>

                <option value="Basquete">
                    🏀 Basquete
                </option>

                <option value="Vôlei">
                    🏐 Vôlei
                </option>

                <option value="Corrida">
                    🏃 Corrida
                </option>

            </select>


            <div class="linha">

                <div>

                    <label>Data</label>

                    <input
                        type="date"
                        id="data">

                </div>


                <div>

                    <label>Horário</label>

                    <input
                        type="time"
                        id="horario">

                </div>

            </div>


            <label>Número de vagas</label>

            <input
                type="number"
                id="vagas"
                min="2"
                value="10">


            <div class="local-selecionado">

                <strong>📍 Local selecionado</strong>

                <p id="localTexto">
                    Nenhum local selecionado
                </p>

            </div>


            <button
                class="criar"
                onclick="criarEmbate()">

                🚀 Criar embate

            </button>

        </div>

    </section>


    <section class="embates">

        <h2>📍 Embates próximos</h2>

        <div id="listaEmbates"></div>

    </section>

</main>


<script src="script.js"></script>


<script
src="<div class="mapouter"><div class="gmap_canvas"><iframe width="1200" height="1200" id="gmap_canvas" src="https://maps.google.com/maps?q=extremoz+rn+ceep&t=&z=13&ie=UTF8&iwloc=&output=embed" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"></iframe><a href="https://textcaseconvert.com/"></a><br><a href="https://online.stopwatch-timer.net">classroom stopwatch</a><br><style>.mapouter{position: relative;text-align: right;height: 1200px;width: 1200px;}</style><a href="https://www.embedmaps.co">location map</a><style>.gmap_canvas{overflow: hidden;background: none !important;height: 1200px;width: 1200px;}</style></div></div>"
async
defer>
</script>

</body>
</html>
